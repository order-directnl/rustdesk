name: Build Order-Direct RustDesk Windows

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows:
    name: Windows x64
    needs: generate-bridge
    runs-on: windows-2022

    steps:
      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Order-Direct hbb_common branding
        shell: pwsh
        run: |
          git -C libs/hbb_common fetch --depth=1 origin production-branding
          git -C libs/hbb_common checkout --detach FETCH_HEAD

      - name: Install Order-Direct branding assets
        shell: pwsh
        run: |
          $required = @(
            "branding/order-direct-logo.png",
            "branding/order-direct-icon.png",
            "branding/order-direct-icon.ico"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing branding asset: $file"
            }
          }

          Copy-Item "branding/order-direct-logo.png" "flutter/assets/logo.png" -Force
          Copy-Item "branding/order-direct-logo.png" "flutter/assets/logo_light.png" -Force
          Copy-Item "branding/order-direct-logo.png" "flutter/assets/logo_dark.png" -Force
          Copy-Item "branding/order-direct-icon.png" "flutter/assets/icon.png" -Force
          Copy-Item "branding/order-direct-icon.png" "res/icon.png" -Force
          Copy-Item "branding/order-direct-icon.ico" "flutter/windows/runner/resources/app_icon.ico" -Force
          Copy-Item "branding/order-direct-icon.ico" "res/icon.ico" -Force

      - name: Restore Flutter/Rust bridge
        uses: actions/download-artifact@v8
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install RustDesk Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip

          Expand-Archive `
            -Path windows-x64-release.zip `
            -DestinationPath windows-x64-release

          Move-Item `
            -Force `
            windows-x64-release/* `
            C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
            $(dirname $(dirname $(which flutter)))

          cd $(dirname $(dirname $(which flutter)))

          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build portable RustDesk
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --hwcodec --vram

      - name: Prepare production executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter "rustdesk-*-install.exe" |
            Select-Object -First 1

          if (-not $exe) {
            throw "Portable RustDesk executable was not created"
          }

          Copy-Item $exe.FullName ".\Order-Direct-Support.exe"

          $rustdeskSha = (git rev-parse HEAD).Trim()
          $hbbSha = (git -C libs/hbb_common rev-parse HEAD).Trim()

          @(
            "## Order-Direct Support build source",
            "",
            "- Open-source/legal page: https://www.order-direct.nl/open-source/order-direct-support",
            "- RustDesk fork commit: $rustdeskSha",
            "- hbb_common commit: $hbbSha",
            "- License: GNU AGPLv3"
          ) | Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY

          Get-Item ".\Order-Direct-Support.exe"

      - name: Upload unsigned build output
        uses: actions/upload-artifact@v7
        with:
          name: Order-Direct-Support-Windows-x64-unsigned
          retention-days: 1
          path: Order-Direct-Support.exe
          if-no-files-found: error

  sign-windows:
    name: Sign Order-Direct Support
    needs: build-windows
    if: github.ref == 'refs/heads/production-branding'
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download unsigned executable
        uses: actions/download-artifact@v8
        with:
          name: Order-Direct-Support-Windows-x64-unsigned
          path: signing

      - name: Authenticate to Azure
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign portable executable
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: orderdirectsigning
          certificate-profile-name: order-direct-productie
          files: ${{ github.workspace }}\signing\Order-Direct-Support.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature and timestamp
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath 'signing/Order-Direct-Support.exe'
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
            throw "Signature or timestamp verification failed: $($signature.StatusMessage)"
          }
          Write-Host "Publisher: $($signature.SignerCertificate.Subject)"

      - name: Upload signed production executable
        uses: actions/upload-artifact@v7
        with:
          name: Order-Direct-Support-Windows-x64
          path: signing/Order-Direct-Support.exe
          if-no-files-found: error
